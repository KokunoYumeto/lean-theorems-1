name: Classical Commons - isolated Noether pilot

on:
  pull_request:
    paths:
      - 'classical-commons/**'
      - '.github/workflows/classical-commons-noether.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: noether-pilot-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolated-noether:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LEAN_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Structural preflight and synthetic checker tests
        run: |
          python3 -m unittest discover -s classical-commons -p 'test_*.py' -v
          python3 classical-commons/check_pilot.py
      - name: Install elan and the pinned Lean toolchain
        working-directory: classical-commons/noether
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/0e36a07b9bbcc5381fa6250df109f9a4f94d7bac/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version
          "$HOME/.elan/bin/lake" --version
      - name: Resolve the pinned dependency manifest
        working-directory: classical-commons/noether
        run: lake update
      - name: Verify resolved commits and selected source blobs
        run: python3 classical-commons/check_pilot.py --resolved
      - name: Fetch Mathlib precompiled cache
        working-directory: classical-commons/noether
        run: lake exe cache get
      - name: Build selected Noether imports and print their axioms
        working-directory: classical-commons/noether
        shell: bash
        run: |
          set -euo pipefail
          lake -KmaxJobs=1 build ClassicalCommonsNoether
          lake env lean --trust=0 -DwarningAsError=true Audit.lean | tee Audit.log
      - name: Reject missing or nonstandard selected axiom reports
        run: python3 classical-commons/check_pilot.py --axiom-log classical-commons/noether/Audit.log
