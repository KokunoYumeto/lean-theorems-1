name: Classical Commons - verified SplitZero component
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  splitzero:
    runs-on: ubuntu-latest
    env:
      LEAN_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Materialize and verify exact source hashes
        run: python3 classical-commons/splitzero/materialize.py
      - name: Install the pinned Lean toolchain
        working-directory: classical-commons/splitzero/.workspace
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/0e36a07b9bbcc5381fa6250df109f9a4f94d7bac/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version
      - name: Resolve and verify Mathlib
        working-directory: classical-commons/splitzero/.workspace
        shell: bash
        run: |
          set -euo pipefail
          lake update
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = fabf563a7c95a166b8d7b6efca11c8b4dc9d911f
          lake exe cache get
      - name: Build, kernel-check, and audit axioms
        working-directory: classical-commons/splitzero/.workspace
        shell: bash
        run: |
          set -euo pipefail
          lake -KmaxJobs=1 build 2>&1 | tee Build.log
          lake env lean --trust=0 SplitZero.lean
          for f in SplitZeroExtension.lean SplitZeroFibres.lean SplitZeroPresentation.lean SplitZeroMaps.lean; do
            lake env lean --trust=0 -DwarningAsError=true "$f"
          done
          lake env lean --trust=0 -DwarningAsError=true Audit.lean | tee Audit.log
          python3 check_axioms.py Audit.log
          python3 test_axioms.py -v
